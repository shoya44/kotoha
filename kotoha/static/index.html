<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/kotoha.png">
  <title>ことは</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #17181b;
      --panel: #1e1f24;
      --line: #2c2d33;
      --ink: #e9e7e2;
      --muted: #8a8a8a;
      --accent: #c584c0;

      --user-bg: #565b64;
      --ai-bg: #232429;
      --ai-line: #35363d;
      --input-bg: #26272c;
      --input-line: #3a3b42;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 14px;

      --chat-max-width: 860px;
      --input-max-height: 120px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== Base ===== */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      height: 100%;
      background: var(--bg);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Noto Sans JP",
        sans-serif;

      display: flex;
      flex-direction: column;
      color: var(--ink);
    }

    #appShell {
      position: relative;

      width: 100%;
      height: var(--vv-height, 100dvh);

      display: flex;
      flex-direction: column;
      overflow: hidden;

      transform: translateY(var(--vv-top, 0px));
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    /* ===== Header / Avatar ===== */
    header {
      flex: none;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 6px max(14px, env(safe-area-inset-right));
      padding-top: calc(6px + env(safe-area-inset-top));
      padding-left: max(14px, env(safe-area-inset-left));

      border-bottom: 1px solid #ffffff12;
      background: #1e1f24cc;
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
    }
    
    .mini-avatar {
      flex: none;
      height: 140px;
      overflow: hidden;
      background: var(--bg);
    }

    .mini-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      
      object-fit: contain;
      object-position: center bottom;
      transform-origin: center bottom;
      transition: opacity .2s ease;
    }

    .mini-avatar img.avatar-react {
      animation: avatar-react .28s ease-out;
    }

    .mini-avatar img.avatar-tap {
      animation: avatar-tap .18s ease-out;
    }

    @keyframes avatar-react {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.008); }
    }

    @keyframes avatar-tap {
      0%   { transform: scale(1); }
      50%  { transform: scale(.985); }
      100% { transform: scale(1); }
    }

    .h-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;

      border: 0;
      padding: 0;
      background: transparent;
      color: var(--accent);

      font-weight: 600;
      cursor: pointer;
    }

    .av {
      flex: none;
      border: 1px solid var(--ai-line);
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 15%;
      background: #000;
    }

    .h-av {
      width: 34px;
      height: 34px;
    }

    #mode {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 11px;
      color: #777;
    }

    /* ===== Chat ===== */
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;

      display: flex;
      flex-direction: column;
      gap: 10px;

      width: 100%;
      max-width: var(--chat-max-width);
      margin: 0 auto;
      padding:
        14px
        max(14px, env(safe-area-inset-right))
        14px
        max(14px, env(safe-area-inset-left));
    }

    .msg {
      padding: 9px 13px;
      border-radius: var(--radius-lg);

      font-size: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .msg[data-time]::after {
      content: attr(data-time);
      display: block;
      margin-top: 4px;

      text-align: right;
      font-size: 10px;
      color: var(--muted);
    }

    .user {
      align-self: flex-end;
      max-width: 84%;

      border-bottom-right-radius: 4px;
      background: var(--user-bg);
      color: #fff;
    }

    .user[data-time]::after {
      color: #ffffffaa;
    }

    .ai-row {
      align-self: flex-start;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 92%;
    }

    .ai-row .av {
      width: 38px;
      height: 38px;
    }

    .ai-row .msg {
      border: 1px solid var(--ai-line);
      border-bottom-left-radius: 4px;
      background: var(--ai-bg);
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9a9aa0;
      animation: typing-dot 1.2s infinite ease-in-out;
    }

    .typing i:nth-child(2) {
      animation-delay: .2s;
    }

    .typing i:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes typing-dot {
      0%,
      80%,
      100% {
        opacity: .25;
        transform: translateY(0);
      }

      40% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    .sys {
      align-self: center;
      padding: 4px 10px;

      border-radius: var(--radius-sm);
      background: #ffffff14;
      color: #999;

      font-size: 12px;
    }

    .date-separator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
      color: var(--muted);
      font-size: 11px;
    }

    .date-separator::before,
    .date-separator::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* ===== Composer ===== */
    #form {
      flex: none;
      width: 100%;
      padding:
        10px
        max(12px, env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .form-inner {
      position: relative;
      width: 100%;
      max-width: var(--chat-max-width);
      margin: 0 auto;
    }

    textarea {
      display: block;
      width: 100%;
      min-width: 0;
      max-height: var(--input-max-height);
      resize: none;
      overflow-y: auto;

      padding: 10px 88px 10px 12px;
      border: 1px solid var(--input-line);
      border-radius: 16px;
      outline: none;

      background: var(--input-bg);
      color: var(--ink);

      font-size: 16px;
      line-height: 1.45;
      field-sizing: content;

      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    button {
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #gatebtn {
      min-width: 88px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #1b1b1b;
      font-weight: 600;
    }

    #send {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: #17181b;
    }

    #send::before {
      content: "";
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      transition: opacity .15s ease, transform .1s ease;
    }

    #send svg {
      position: relative;
      z-index: 1;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #send:active::before { transform: scale(.94); }
    #send:disabled { cursor: default; }
    #send:disabled::before { opacity: .4; }

    /* 通話ボタン。送信が主操作なので、待機中は塗らずに一段控えめにする。 */
    #call {
      position: absolute;
      right: 44px;
      bottom: 0;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
    }

    #call::before {
      content: "";
      position: absolute;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      transition: background-color .15s ease, transform .1s ease;
    }

    #call svg {
      position: relative;
      z-index: 1;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #call:active::before { transform: scale(.94); }
    #call .icon-hangup { display: none; }

    body.calling #call {
      color: #fff;
    }

    body.calling #call::before {
      background: #ff453a;
    }

    body.calling #call .icon-call { display: none; }
    body.calling #call .icon-hangup { display: block; }

    /* 音声入力に対応しない環境では通話を出さず、入力欄の余白も戻す。 */
    body.no-call #call { display: none; }
    body.no-call textarea { padding-right: 48px; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    /* ===== Gate / Settings ===== */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;

      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom));

      background: var(--bg);
    }

    .gate-av {
      width: 150px;
      height: 150px;

      border: 3px solid var(--panel);
      box-shadow: 0 4px 20px #0008;
    }

    #gate .t {
      color: var(--accent);
      font-weight: 600;
    }

    #gate input {
      width: min(260px, 100%);
      padding: 10px;

      border: 1px solid var(--input-line);
      border-radius: 10px;
      outline: none;

      background: var(--input-bg);
      color: var(--ink);

      font-size: 16px;
      text-align: center;
    }

    #gateerr {
      min-height: 1.2em;
      color: #d88;
      font-size: 12px;
    }

    .identity {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .name {
      color: var(--accent);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.2;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 14px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: #7fba83;
      transition: background-color .2s ease, opacity .2s ease;
    }

    .status.thinking .status-dot {
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .status.offline .status-dot {
      background: #777;
      opacity: .7;
    }

    .status.calling .status-dot {
      background: #30d158;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-top: calc(20px + env(safe-area-inset-top));
      background: #00000070;
    }

    .overlay.open { display: flex; }

    .sheet {
      width: min(100%, 520px);
      max-height: min(78dvh, 680px);
      overflow-y: auto;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
      border: 1px solid #ffffff12;
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
      background: #202126f2;
      box-shadow: 0 -14px 40px #0005;
      backdrop-filter: blur(22px) saturate(135%);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
    }

    .sheet-handle {
      width: 36px;
      height: 5px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #ffffff28;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 2px 16px;
    }

    .profile .av { width: 56px; height: 56px; }
    .profile-title { font-size: 17px; font-weight: 650; }
    .profile-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .sheet-section {
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid #ffffff0d;
      border-radius: 14px;
      background: #ffffff08;
    }

    .sheet-row {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 14px;
      border-bottom: 1px solid #ffffff0d;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .sheet-row:last-child { border-bottom: 0; }
    .sheet-row.secondary { color: #d4a2d0; }
    .sheet-value { color: var(--muted); font-size: 12px; }

    .context-menu {
      position: fixed;
      z-index: 40;
      min-width: 160px;
      overflow: hidden;
      display: none;
      padding: 5px;
      border: 1px solid #ffffff16;
      border-radius: 14px;
      background: #28292eea;
      box-shadow: 0 12px 36px #0007;
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
    }

    .context-menu.open { display: block; }

    .context-menu button {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 11px;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
      text-align: left;
    }

    .context-menu button:active { background: #ffffff12; }
    .reaction-mark { margin-top: 4px; color: var(--muted); font-size: 11px; text-align: right; }
    body.hide-time .msg[data-time]::after { display: none; }

    @media (display-mode: standalone) {
      header { padding-top: calc(6px + env(safe-area-inset-top)); }
    }


    .msg-enter {
      animation: msg-in .16s ease-out both;
    }

    @keyframes msg-in {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Utilities ===== */
    #jumpBottom {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: calc(78px + env(safe-area-inset-bottom));
      z-index: 12;

      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;

      border: 1px solid #ffffff14;
      border-radius: 50%;
      background: #27282dcc;
      color: var(--ink);

      box-shadow: 0 6px 18px #0005;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);

      transition:
        opacity .15s ease,
        transform .15s ease,
        background-color .15s ease;
    }

    #jumpBottom.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #jumpBottom:active {
      background: #303136e6;
      transform: translateY(0) scale(.96);
    }

    #jumpBottom svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-contrast: more) {
      :root {
        --line: #484950;
        --ai-line: #55565e;
        --input-line: #5e6068;
        --ink: #fff;
      }

      #mode,
      .status,
      .msg[data-time]::after { color: #b8b8bd; }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div id="gate" aria-modal="true" role="dialog" aria-labelledby="gate-title">
    <img class="av gate-av" src="/static/kotoha.png" alt="">
    <div class="t" id="gate-title">ことは の鍵</div>
    <input
      id="token"
      type="password"
      placeholder="トークン"
      autocomplete="current-password"
      aria-describedby="gateerr"
    >
    <button id="gatebtn" type="button">接続</button>
    <div id="gateerr" role="alert"></div>
  </div>

<div id="appShell">

  <header>
    <button
      class="h-left"
      id="face"
      type="button"
      aria-label="ことはの設定を開く"
    >
      <img class="av h-av" src="/static/kotoha.png" alt="">
      <span class="identity">
        <span class="name">ことは</span>
        <span class="status" id="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">いるよ</span>
        </span>
      </span>
    </button>
    <span id="mode" aria-live="polite"></span>
  </header>
  
  <section class="mini-avatar">
    <img id="miniAvatarImage"
       src="/static/avatar/kotoha_morning_sleepy.png"
       alt="ことは">
  </section>
  
  <main id="log" aria-live="polite" aria-relevant="additions"></main>


  <button id="jumpBottom" type="button" aria-label="最新メッセージへ移動">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 9l6 6 6-6"></path>
    </svg>
  </button>

  <form id="form">
    <div class="form-inner">
      <textarea
        id="input"
        rows="1"
        placeholder="なにか話す…"
        aria-label="メッセージ"
      ></textarea>
      <button id="call" type="button" aria-label="通話をはじめる" aria-pressed="false">
        <svg class="icon-call" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21 16.9v2.6a2 2 0 0 1-2.2 2 19.5 19.5 0 0 1-8.5-3 19.2 19.2 0 0 1-5.9-5.9 19.5 19.5 0 0 1-3-8.6A2 2 0 0 1 3.4 2H6a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.7a2 2 0 0 1-.5 2.1L7.1 9.7a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path>
        </svg>
        <svg class="icon-hangup" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.7.7a2 2 0 0 1 1.7 2v2.6a2 2 0 0 1-2.2 2 19.5 19.5 0 0 1-8.5-3 19.3 19.3 0 0 1-3.3-2.7M7.4 10a19.5 19.5 0 0 1-3-8.6A2 2 0 0 1 6.3 2h2.6a2 2 0 0 1 2 1.7c.1.9.3 1.8.7 2.7a2 2 0 0 1-.5 2.1L10 9.7"></path>
          <line x1="2" y1="2" x2="22" y2="22"></line>
        </svg>
      </button>
      <button id="send" type="submit" aria-label="送信">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5l-6 6m6-6 6 6M12 5v14"></path>
        </svg>
      </button>
    </div>
  </form>

</div>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="profile">
        <img class="av" src="/static/kotoha.png" alt="">
        <div>
          <div class="profile-title" id="settingsTitle">ことは</div>
          <div class="profile-sub" id="sheetStatus">いるよ</div>
        </div>
      </div>
      <div class="sheet-section">
        <button class="sheet-row" id="toggleTime" type="button">
          <span>メッセージ時刻</span>
          <span class="sheet-value" id="timeValue">表示</span>
        </button>
        <button class="sheet-row" id="toggleVoice" type="button">
          <span>声で話す</span>
          <span class="sheet-value" id="voiceValue">オフ</span>
        </button>
        <button class="sheet-row secondary" id="changeToken" type="button">
          <span>接続トークンを変更</span>
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </section>
  </div>

  <div class="context-menu" id="contextMenu" role="menu" aria-hidden="true"></div>

  <script>
    // ===== DOM / State =====
    const $ = id => document.getElementById(id);

    const elements = {
      gate: $("gate"),
      gateButton: $("gatebtn"),
      gateError: $("gateerr"),
      tokenInput: $("token"),
      face: $("face"),
      status: $("status"),
      statusText: $("statusText"),
      sheetStatus: $("sheetStatus"),
      mode: $("mode"),
      log: $("log"),
      form: $("form"),
      input: $("input"),
      sendButton: $("send"),
      callButton: $("call"),
      jumpBottom: $("jumpBottom"),
      settingsOverlay: $("settingsOverlay"),
      toggleTime: $("toggleTime"),
      timeValue: $("timeValue"),
      toggleVoice: $("toggleVoice"),
      voiceValue: $("voiceValue"),
      changeToken: $("changeToken"),
      contextMenu: $("contextMenu"),
    };

    const AVATAR_URL = "/static/kotoha.png";
    const MAX_INPUT_HEIGHT = 120;
    const LONG_PRESS_MS = 520;

    let token = localStorage.getItem("kotoha_token") || "";
    let longPressTimer = null;

    const preferences = {
      showTime: localStorage.getItem("kotoha_show_time") !== "0",
      voice: localStorage.getItem("kotoha_voice") === "1",
    };

    // ===== Mini avatar =====
    const avatarByTime = {
      morning: [
        "/static/avatar/kotoha_morning_sleepy.png",
        "/static/avatar/kotoha_morning_coffee.png",
      ],
      day: [
        "/static/avatar/kotoha_day_phone.png",
        "/static/avatar/kotoha_day_idle.png",
      ],
      afternoon: [
        "/static/avatar/kotoha_afternoon_nap.png",
        "/static/avatar/kotoha_snack.png",
      ],
      evening: [
        "/static/avatar/kotoha_evening_bath.png",
      ],
      night: [
        "/static/avatar/kotoha_night_game.png",
        "/static/avatar/kotoha_night_phone.png",
      ],
      sleep: [
        "/static/avatar/kotoha_sleep.png",
      ],
    };

    function getAvatarGroup() {
      const hour = new Date().getHours();

      if (hour >= 6 && hour < 11) return "morning";
      if (hour >= 11 && hour < 14) return "day";
      if (hour >= 14 && hour < 17) return "afternoon";
      if (hour >= 17 && hour < 21) return "evening";
      if (hour >= 21 || hour < 2) return "night";

      return "sleep";
    }

    function updateMiniAvatar() {
      const groupName = getAvatarGroup();
      const images = avatarByTime[groupName];

      // 日付 + 時間帯で1枚固定
      const now = new Date();
      const seed = now.getDate() + groupName.length;
      const index = seed % images.length;

      $("miniAvatarImage").src = images[index];
      scheduleBlink();
    }
    
    let blinkTimer = null;

    function getBlinkSrc(src) {
      return src.replace(".png", "_blink.png");
    }

    function scheduleBlink() {
      clearTimeout(blinkTimer);

      const delay = 8000 + Math.random() * 7000;

      blinkTimer = setTimeout(async () => {
        const image = $("miniAvatarImage");
        const normalSrc = image.src;
        const blinkSrc = getBlinkSrc(normalSrc);

        const preload = new Image();
        preload.src = blinkSrc;

        try {
          await preload.decode();

          image.src = blinkSrc;

          setTimeout(() => {
            image.src = normalSrc;
            scheduleBlink();
          }, 130);

        } catch {
          // blink画像が無い場合はそのまま
          scheduleBlink();
        }
      }, delay);
    }

    function reactAvatar(className = "avatar-react") {
      const image = $("miniAvatarImage");

      image.classList.remove(className);
      void image.offsetWidth;
      image.classList.add(className);
    }

    // ===== API =====
    function api(path, options = {}) {
      const headers = {
        ...(options.headers || {}),
        "X-Kotoha-Token": token,
      };
      const fetchOptions = { ...options, headers };

      if (options.body !== undefined) {
        headers["Content-Type"] = "application/json";
        fetchOptions.body = JSON.stringify(options.body);
      }
      return fetch(path, fetchOptions);
    }
    
    
    // ===== Voice =====
    // 読み上げは会話とは独立させる。エンジンが止まっていても会話は続ける。
    let currentAudio = null;
    let calling = false;

    function stopSpeaking() {
      if (!currentAudio) return;
      currentAudio.pause();
      URL.revokeObjectURL(currentAudio.src);
      currentAudio = null;
    }

    // 通話中は設定に関わらず声を出す。再生し終えるまで待てるように解決を返す。
    async function speak(text) {
      if ((!preferences.voice && !calling) || !text) return;
      stopSpeaking();
      try {
        const response = await api("/api/speak", { method: "POST", body: { text } });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          setStatus(error.detail || "声を出せない", calling ? "calling" : "online");
          return;
        }
        const audio = new Audio(URL.createObjectURL(await response.blob()));
        currentAudio = audio;
        await audio.play();
        // pause も拾う。止められたときに待ち続けないようにする。
        await new Promise(resolve => {
          audio.addEventListener("ended", resolve, { once: true });
          audio.addEventListener("pause", resolve, { once: true });
          audio.addEventListener("error", resolve, { once: true });
        });
        if (currentAudio === audio) stopSpeaking();
      } catch {
        // 読み上げの失敗で会話を止めない。
      }
    }

    // ===== Call =====
    // 方針: 読み上げ中はマイクを開かない。スピーカーでも自分の声を拾わない。
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let callBusy = false;

    function listen() {
      if (!calling || callBusy || !recognition) return;
      try {
        recognition.start();
      } catch {
        // すでに聞いている場合の二重startは無視してよい。
      }
    }

    async function onHeard(text) {
      if (!calling || !text) return;
      callBusy = true;
      elements.input.value = text;
      try {
        await send();  // 応答の生成から読み上げ終わりまで
      } finally {
        callBusy = false;
      }
      if (calling) {
        setStatus("通話中", "calling");
        listen();
      }
    }

    function createRecognition() {
      const engine = new SpeechRecognition();
      engine.lang = "ja-JP";
      engine.continuous = false;
      engine.interimResults = false;
      engine.maxAlternatives = 1;
      engine.addEventListener("result", event => {
        onHeard((event.results[0][0].transcript || "").trim());
      });
      engine.addEventListener("error", event => {
        // 無音や中断は通話の終わりではない。聞き直す。
        if (event.error === "no-speech" || event.error === "aborted") return;
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          addMessage("system", "[エラー] マイクの使用が許可されていません");
          endCall();
          return;
        }
        addMessage("system", "[エラー] 音声入力: " + event.error);
      });
      // 発話が切れるたびに終わるので、話していないあいだは開き直す。
      engine.addEventListener("end", () => listen());
      return engine;
    }

    function updateCallButton() {
      document.body.classList.toggle("calling", calling);
      elements.callButton.setAttribute("aria-pressed", calling ? "true" : "false");
      elements.callButton.setAttribute(
        "aria-label", calling ? "通話を終わる" : "通話をはじめる"
      );
    }

    function startCall() {
      if (calling) return;
      calling = true;
      recognition = createRecognition();
      updateCallButton();
      setStatus("通話中", "calling");
      listen();
    }

    function endCall() {
      if (!calling) return;
      calling = false;
      callBusy = false;
      stopSpeaking();
      if (recognition) {
        recognition.abort();
        recognition = null;
      }
      updateCallButton();
      setStatus("いるよ");
    }

    // ===== Date / Time =====
    let lastDateKey = null;

    function parseMessageDate(value) {
      if (!value) return new Date();

      const normalized = String(value)
        .trim()
        .replace(" ", "T")
        .replace(/(\.\d{3})\d+/, "$1");

      const date = new Date(normalized);
      return Number.isNaN(date.getTime()) ? new Date() : date;
    }

    function getDateKey(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0"),
      ].join("-");
    }

    function formatDateLabel(date) {
      const now = new Date();

      const today = new Date(
        now.getFullYear(), now.getMonth(), now.getDate()
      );

      const target = new Date(
        date.getFullYear(), date.getMonth(), date.getDate()
      );

      const days = Math.round((today - target) / 86400000);

      if (days === 0) return "今日";
      if (days === 1) return "昨日";

      if (date.getFullYear() === now.getFullYear()) {
        return `${date.getMonth() + 1}月${date.getDate()}日`;
      }

      return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
    }

    function addDateSeparator(date) {
      const key = getDateKey(date);
      if (key === lastDateKey) return;

      const separator = document.createElement("div");
      separator.className = "date-separator";
      separator.textContent = formatDateLabel(date);

      elements.log.appendChild(separator);
      lastDateKey = key;
    }

    function formatTime(value) {
      const raw = value ? String(value).trim() : "";
      if (!raw) return "";

      const normalized = raw
        .replace(" ", "T")
        .replace(/(\.\d{3})\d+/, "$1");

      const date = new Date(normalized);
      if (Number.isNaN(date.getTime())) return "";

      const now = new Date();

      const startToday = new Date(
        now.getFullYear(), now.getMonth(), now.getDate()
      );

      const startTarget = new Date(
        date.getFullYear(), date.getMonth(), date.getDate()
      );

      const days =
        Math.round((startToday - startTarget) / 86400000);

      const time = date.toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
      });

      if (days === 0) return time;
      if (days === 1) return `昨日 ${time}`;

      if (days > 1 && days < 7) {
        const weekday = date.toLocaleDateString("ja-JP", {
          weekday: "short",
        });
        return `${weekday} ${time}`;
      }

      if (date.getFullYear() === now.getFullYear()) {
        return `${date.getMonth() + 1}/${date.getDate()} ${time}`;
      }

      return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${time}`;
    }

    // ===== Chat UI =====
    function setStatus(label, state = "online") {
      elements.status.classList.remove("thinking", "offline", "calling");
      if (state !== "online") elements.status.classList.add(state);
      elements.statusText.textContent = label;
      elements.sheetStatus.textContent = label;
    }

    function applyPreferences() {
      document.body.classList.toggle("hide-time", !preferences.showTime);
      elements.timeValue.textContent = preferences.showTime ? "表示" : "非表示";
      elements.voiceValue.textContent = preferences.voice ? "オン" : "オフ";
    }

    function isNearBottom(threshold = 80) {
      const distance =
        elements.log.scrollHeight -
        elements.log.scrollTop -
        elements.log.clientHeight;

      return distance <= threshold;
    }

    function updateJumpButton() {
      elements.jumpBottom.classList.toggle("show", !isNearBottom());
    }

    function scrollToBottom(behavior = "auto") {
      elements.log.scrollTo({
        top: elements.log.scrollHeight,
        behavior,
      });

      requestAnimationFrame(updateJumpButton);
    }

    function createAvatar() {
      const avatar = document.createElement("img");
      avatar.className = "av";
      avatar.src = AVATAR_URL;
      avatar.alt = "";
      return avatar;
    }

    function createMessageBubble(role, text, iso) {
      const bubble = document.createElement("div");
      bubble.className = "msg";
      bubble.dataset.role = role;
      bubble.dataset.text = text;
      bubble.textContent = text;

      if (iso !== false && role !== "system" && role !== "sys") {
        bubble.dataset.time = formatTime(iso);
      }

      bindMessageInteractions(bubble);
      return bubble;
    }

    function addMessage(role, text, iso) {
      const shouldFollow = isNearBottom();
      
    if (iso !== false) {
      const date = parseMessageDate(iso);
      addDateSeparator(date);
    }

      let element;
      let bubble;

      if (role === "assistant") {
        element = document.createElement("div");
        element.className = "ai-row";
        bubble = createMessageBubble(role, text, iso);
        element.append(createAvatar(), bubble);
      } else {
        bubble = createMessageBubble(role, text, role === "user" ? iso : false);
        bubble.classList.add(role === "user" ? "user" : "sys");
        element = bubble;
      }

      bubble.classList.add("msg-enter");
      elements.log.appendChild(element);

      if (shouldFollow) {
        scrollToBottom();
      } else {
        updateJumpButton();
      }

      return bubble;
    }

    function addTypingIndicator() {
      const bubble = addMessage("assistant", "", false);
      bubble.classList.add("typing");
      bubble.removeAttribute("data-text");
      bubble.replaceChildren(
        document.createElement("i"),
        document.createElement("i"),
        document.createElement("i"),
      );
      return bubble.closest(".ai-row");
    }

    function resizeInput() {
      elements.input.style.height = "auto";
      elements.input.style.height = `${Math.min(elements.input.scrollHeight, MAX_INPUT_HEIGHT)}px`;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const helper = document.createElement("textarea");
        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
    }

    function markReaction(bubble, reaction) {
      bubble.querySelector(".reaction-mark")?.remove();
      const mark = document.createElement("div");
      mark.className = "reaction-mark";
      mark.textContent = reaction;
      bubble.appendChild(mark);
    }

    function closeContextMenu() {
      elements.contextMenu.classList.remove("open");
      elements.contextMenu.setAttribute("aria-hidden", "true");
      elements.contextMenu.replaceChildren();
    }

    function addContextAction(label, action) {
      const button = document.createElement("button");
      button.type = "button";
      button.role = "menuitem";
      button.textContent = label;
      button.addEventListener("click", async () => {
        reactAvatar("avatar-tap");
        await action();
        closeContextMenu();
      });
      elements.contextMenu.appendChild(button);
    }

    function openContextMenu(bubble, x, y) {
      if (bubble.classList.contains("typing")) return;
      closeContextMenu();

      const role = bubble.dataset.role;
      const text = bubble.dataset.text || "";
      addContextAction("コピー", () => copyText(text));

      if (role === "assistant") {
        addContextAction("👍 良い", () => markReaction(bubble, "👍"));
        addContextAction("👎 微妙", () => markReaction(bubble, "👎"));
      }

      if (role === "user") {
        addContextAction("編集して再送", () => {
          elements.input.value = text;
          resizeInput();
          elements.input.focus();
        });
      }

      elements.contextMenu.classList.add("open");
      elements.contextMenu.setAttribute("aria-hidden", "false");
      const rect = elements.contextMenu.getBoundingClientRect();
      const pad = 10;
      const left = Math.min(Math.max(pad, x - rect.width / 2), window.innerWidth - rect.width - pad);
      const top = Math.min(Math.max(pad, y - rect.height - 12), window.innerHeight - rect.height - pad);
      elements.contextMenu.style.left = `${left}px`;
      elements.contextMenu.style.top = `${top}px`;
    }

    function bindMessageInteractions(bubble) {
      bubble.addEventListener("contextmenu", event => {
        event.preventDefault();
        openContextMenu(bubble, event.clientX, event.clientY);
      });

      bubble.addEventListener("pointerdown", event => {
        if (event.pointerType !== "touch") return;
        clearTimeout(longPressTimer);
        const x = event.clientX;
        const y = event.clientY;
        longPressTimer = setTimeout(() => openContextMenu(bubble, x, y), LONG_PRESS_MS);
      });

      const cancel = () => {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      };
      bubble.addEventListener("pointerup", cancel);
      bubble.addEventListener("pointercancel", cancel);
      bubble.addEventListener("pointermove", cancel);
    }

    function openSettings() {
      closeContextMenu();
      elements.settingsOverlay.classList.add("open");
      elements.settingsOverlay.setAttribute("aria-hidden", "false");
    }

    function closeSettings() {
      elements.settingsOverlay.classList.remove("open");
      elements.settingsOverlay.setAttribute("aria-hidden", "true");
    }

    // ===== Session / Chat =====
    async function loadHistory() {
      const response = await api("/api/history");
      if (response.status === 401) return false;
      if (!response.ok) throw new Error(`history:${response.status}`);

      const rows = await response.json();
      
      elements.log.replaceChildren();
      lastDateKey = null;
      
      rows.forEach(message => addMessage(message.role, message.text, message.created_at));
      scrollToBottom();
      return true;
    }

    async function unlock() {
      token = elements.tokenInput.value.trim();
      elements.gateError.textContent = "";
      try {
        if (!await loadHistory()) {
          elements.gateError.textContent = "トークンが違います";
          return;
        }
        localStorage.setItem("kotoha_token", token);
        elements.gate.style.display = "none";
        setStatus("いるよ");
        elements.input.focus();
      } catch {
        setStatus("接続できない", "offline");
        elements.gateError.textContent = "接続できませんでした";
      }
    }

    async function send() {
      const text = elements.input.value.trim();
      if (!text || elements.sendButton.disabled) return;

      closeContextMenu();
      elements.input.value = "";
      resizeInput();
      addMessage("user", text);
      reactAvatar();
      elements.sendButton.disabled = true;
      setStatus("考え中…", "thinking");
      const typingRow = addTypingIndicator();

      try {
        const response = await api("/api/chat", { method: "POST", body: { text } });
        typingRow?.remove();

        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          addMessage("system", "[エラー] " + (error.detail || response.status));
          setStatus("いるよ");
          return;
        }

        const data = await response.json();
        // ことは側から始まる会話も、通常のAIメッセージとして同じ見た目で扱う。
        addMessage("assistant", data.reply);
        reactAvatar();
        elements.mode.textContent = data.mode || "";
        setStatus(calling ? "通話中" : "いるよ", calling ? "calling" : "online");
        // 呼び出し側が読み上げの終わりまで待てるように返す。
        return speak(data.reply);
      } catch {
        typingRow?.remove();
        addMessage("system", "[エラー] 通信失敗");
        setStatus("接続できない", "offline");
      } finally {
        elements.sendButton.disabled = false;
        elements.input.focus();
      }
    }

    // ===== Events =====
    elements.gateButton.addEventListener("click", unlock);
    elements.tokenInput.addEventListener("keydown", event => {
      if (event.key === "Enter") { event.preventDefault(); unlock(); }
    });

    elements.face.addEventListener("click", openSettings);
    elements.settingsOverlay.addEventListener("click", event => {
      if (event.target === elements.settingsOverlay) closeSettings();
    });

    elements.toggleTime.addEventListener("click", () => {
      preferences.showTime = !preferences.showTime;
      localStorage.setItem("kotoha_show_time", preferences.showTime ? "1" : "0");
      // ===== Initialize =====
    applyPreferences();
      updateJumpButton();
    });

    elements.callButton.addEventListener("click", () => {
      if (calling) endCall(); else startCall();
    });

    elements.toggleVoice.addEventListener("click", () => {
      preferences.voice = !preferences.voice;
      localStorage.setItem("kotoha_voice", preferences.voice ? "1" : "0");
      if (!preferences.voice) stopSpeaking();
      applyPreferences();
    });

    elements.changeToken.addEventListener("click", () => {
      localStorage.removeItem("kotoha_token");
      token = "";
      closeSettings();
      elements.tokenInput.value = "";
      elements.gate.style.display = "flex";
      elements.tokenInput.focus();
    });

    elements.log.addEventListener("scroll", updateJumpButton, { passive: true });

    elements.jumpBottom.addEventListener("click", () => {
      scrollToBottom("smooth");
    });


    elements.input.addEventListener("input", resizeInput);
    elements.input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        send();
      }
    });
    elements.form.addEventListener("submit", event => { event.preventDefault(); send(); });

    document.addEventListener("pointerdown", event => {
      if (elements.contextMenu.classList.contains("open") && !elements.contextMenu.contains(event.target)) {
        closeContextMenu();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeContextMenu();
        closeSettings();
      }
    });
    window.addEventListener("resize", closeContextMenu);

    // ===== iOS Visual Viewport =====
    let viewportRaf = null;

    function syncVisualViewport() {
      if (viewportRaf) return;

      viewportRaf = requestAnimationFrame(() => {
        const viewport = window.visualViewport;

        const height = viewport?.height ?? window.innerHeight;
        const top = viewport?.offsetTop ?? 0;

        document.documentElement.style.setProperty(
          "--vv-height",
          `${Math.round(height)}px`
        );

        document.documentElement.style.setProperty(
          "--vv-top",
          `${Math.round(top)}px`
        );

        viewportRaf = null;
      });
    }

    syncVisualViewport();
    window.visualViewport?.addEventListener("resize", syncVisualViewport);
    window.visualViewport?.addEventListener("scroll", syncVisualViewport);


    applyPreferences();
    updateMiniAvatar();
    // 音声入力に対応しない環境では通話ボタンを出さない。
    document.body.classList.toggle("no-call", !SpeechRecognition);

    setInterval(updateMiniAvatar, 30 * 60 * 1000);

    (async () => {
      if (!token) {
        elements.tokenInput.focus();
        return;
      }
      try {
        if (await loadHistory()) {
          elements.gate.style.display = "none";
          setStatus("いるよ");
          elements.input.focus();
          return;
        }
      } catch {
        setStatus("接続できない", "offline");
      }
      token = "";
      elements.tokenInput.focus();
    })();
  </script>
</body>
</html>
