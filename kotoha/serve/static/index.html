<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <link rel="apple-touch-icon" href="/static/kotoha.png">
  <title>ことは</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="gate" aria-modal="true" role="dialog" aria-labelledby="gate-title">
    <img class="av gate-av" src="/static/kotoha.png" alt="">
    <div class="t" id="gate-title">ことは の鍵</div>
    <input
      id="token"
      type="password"
      placeholder="トークン"
      autocomplete="current-password"
      aria-describedby="gateerr"
    >
    <button id="gatebtn" type="button">接続</button>
    <div id="gateerr" role="alert"></div>
  </div>

  <div id="appShell">

    <header>
      <button
        class="h-left"
        id="face"
        type="button"
        aria-label="ことはの設定を開く"
      >
        <img class="av h-av" src="/static/kotoha.png" alt="">
        <span class="identity">
          <span class="name">ことは</span>
          <span class="status" id="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">いるよ</span>
          </span>
        </span>
      </button>
      <span id="mode" aria-live="polite"></span>
    </header>

    <section class="mini-avatar">
      <img id="miniAvatarImage"
         src="/static/avatar/kotoha_morning_sleepy.png"
         alt="ことは">
    </section>

    <main id="log" aria-live="polite" aria-relevant="additions"></main>

    <button id="jumpBottom" type="button" aria-label="最新メッセージへ移動">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 9l6 6 6-6"></path>
      </svg>
    </button>

    <form id="form">
      <div class="form-inner">
        <textarea
          id="input"
          rows="1"
          placeholder="なにか話す…"
          aria-label="メッセージ"
        ></textarea>
        <button id="call" type="button" aria-label="通話をはじめる" aria-pressed="false">
          <svg class="icon-call" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97a15.045 15.045 0 0 1-6.59-6.59l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3.24 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"></path>
          </svg>
          <svg class="icon-hangup" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08A.956.956 0 0 1 0 12.38c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"></path>
          </svg>
        </button>
        <button id="send" type="submit" aria-label="送信">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5l-6 6m6-6 6 6M12 5v14"></path>
          </svg>
        </button>
      </div>
    </form>

  </div>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-handle" aria-hidden="true"></div>

      <div class="sheet-page active" data-page="main">
      <div class="profile">
        <img class="av" src="/static/kotoha.png" alt="">
        <div>
          <div class="profile-title" id="settingsTitle">ことは</div>
          <div class="profile-sub" id="sheetStatus">いるよ</div>
        </div>
      </div>
      <div class="sheet-section">
        <button class="sheet-row" id="toggleTime" type="button">
          <span>メッセージ時刻</span>
          <span class="sheet-value" id="timeValue">表示</span>
        </button>
        <button class="sheet-row" id="toggleVoice" type="button">
          <span>声で話す</span>
          <span class="sheet-value" id="voiceValue">オフ</span>
        </button>
        <button class="sheet-row" id="togglePush" type="button" hidden>
          <span>通知を受け取る</span>
          <span class="sheet-value" id="pushValue">オフ</span>
        </button>
      </div>

      <div class="sheet-section">
        <button class="sheet-row" data-open="prompts" type="button">
          <span>ことばを直す</span>
          <span aria-hidden="true">›</span>
        </button>
        <button class="sheet-row" data-open="settings" type="button">
          <span>設定を変える</span>
          <span aria-hidden="true">›</span>
        </button>
        <button class="sheet-row" data-open="memories" type="button">
          <span>記憶を見る</span>
          <span aria-hidden="true">›</span>
        </button>
        <button class="sheet-row" data-open="reminders" type="button">
          <span>預かっているもの</span>
          <span aria-hidden="true">›</span>
        </button>
        <button class="sheet-row" data-open="machine" type="button">
          <span>PCの様子</span>
          <span aria-hidden="true">›</span>
        </button>
      </div>

      <div class="sheet-section">
        <button class="sheet-row" id="endRemoteCall" type="button">
          <span>ほかの端末の通話を切る</span>
          <span class="sheet-value" id="remoteCallValue"></span>
        </button>
        <button class="sheet-row danger" id="restartApp" type="button">
          <span id="restartLabel">再起動する</span>
        </button>
      </div>

      <div class="sheet-section">
        <button class="sheet-row secondary" id="changeToken" type="button">
          <span>接続トークンを変更</span>
          <span aria-hidden="true">›</span>
        </button>
      </div>
      </div>

      <section class="sheet-page" data-page="prompts" aria-label="ことばを直す">
        <div class="sheet-nav">
          <button class="sheet-back" data-back type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>戻る</span>
          </button>
          <span class="sheet-nav-title">ことばを直す</span>
        </div>
        <div class="segmented" id="promptTabs" role="tablist"></div>
        <textarea id="promptText" spellcheck="false" aria-label="本文"></textarea>
        <p class="sheet-note" id="promptNote">保存すると次の発言から変わります。</p>
        <div class="sheet-actions">
          <button class="sheet-button" id="promptRevert" type="button">ひとつ前に戻す</button>
          <button class="sheet-button primary" id="promptSave" type="button">保存</button>
        </div>
      </section>

      <section class="sheet-page" data-page="memories" aria-label="記憶を見る">
        <div class="sheet-nav">
          <button class="sheet-back" data-back type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>戻る</span>
          </button>
          <span class="sheet-nav-title">記憶を見る</span>
        </div>
        <div class="segmented" id="memoryTabs" role="tablist">
          <button type="button" data-kind="semantic" aria-selected="true">覚えたこと</button>
          <button type="button" data-kind="episode" aria-selected="false">できごと</button>
          <button type="button" data-kind="pinned" aria-selected="false">保護</button>
        </div>
        <div id="memoryList"></div>
        <p class="sheet-note" id="memoryNote"></p>
      </section>

      <section class="sheet-page" data-page="memory" aria-label="記憶の中身">
        <div class="sheet-nav">
          <button class="sheet-back" data-back-to="memories" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>一覧</span>
          </button>
          <span class="sheet-nav-title">記憶の中身</span>
        </div>
        <textarea id="memoryText" spellcheck="false" aria-label="本文"></textarea>
        <dl class="memory-facts" id="memoryFacts"></dl>
        <p class="sheet-note" id="memoryDetailNote"></p>
        <div class="sheet-actions">
          <button class="sheet-button" id="memoryPin" type="button">保護する</button>
          <button class="sheet-button primary" id="memorySave" type="button">保存</button>
        </div>
        <div class="sheet-actions">
          <button class="sheet-button danger" id="memoryDelete" type="button">この記憶を消す</button>
        </div>
      </section>

      <section class="sheet-page" data-page="reminders" aria-label="預かっているもの">
        <div class="sheet-nav">
          <button class="sheet-back" data-back type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>戻る</span>
          </button>
          <span class="sheet-nav-title">預かっているもの</span>
        </div>
        <div id="reminderList"></div>
        <p class="sheet-note" id="reminderNote"></p>
      </section>

      <section class="sheet-page" data-page="machine" aria-label="PCの様子">
        <div class="sheet-nav">
          <button class="sheet-back" data-back type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>戻る</span>
          </button>
          <span class="sheet-nav-title">PCの様子</span>
        </div>
        <div id="machineList"></div>
        <p class="sheet-note" id="machineNote">開いたときの様子です。</p>
      </section>

      <section class="sheet-page" data-page="settings" aria-label="設定を変える">
        <div class="sheet-nav">
          <button class="sheet-back" data-back type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
            <span>戻る</span>
          </button>
          <span class="sheet-nav-title">設定を変える</span>
        </div>
        <div id="settingsList"></div>
        <p class="sheet-note" id="settingsNote">保存すると再起動なしで反映されます。</p>
        <div class="sheet-actions">
          <button class="sheet-button primary" id="settingsSave" type="button">保存</button>
        </div>
      </section>
    </section>
  </div>

  <div class="context-menu" id="contextMenu" role="menu" aria-hidden="true"></div>
  <script src="/static/app.js"></script>
</body>
</html>
