<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通知のしらべ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="しらべ">
  <style>
    body { font: 15px/1.7 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
    #log { white-space: pre-wrap; word-break: break-all; }
    .ng { color: #ff8080; }
    .ok { color: #80ff9f; }
    button { font: inherit; padding: 12px 18px; margin: 12px 8px 0 0; }
  </style>
</head>
<body>
  <h1>通知のしらべ</h1>
  <p>ことは本体とは別の、通知だけを試す画面です。</p>
  <button id="ask" type="button">許可を聞く</button>
  <button id="sub" type="button">受け取る</button>
  <div id="log"></div>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    const APP_ID = "3aedc5a9-07d2-4e58-a93d-3b707d00a7bb";
    const box = document.getElementById("log");

    function say(text, kind) {
      const line = document.createElement("div");
      line.textContent = new Date().toLocaleTimeString() + "  " + text;
      if (kind) line.className = kind;
      box.appendChild(line);
    }

    function standalone() {
      return window.matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;
    }

    say("端末: " + navigator.userAgent.slice(0, 90));
    say("ホーム画面から: " + standalone());
    say("serviceWorker: " + ("serviceWorker" in navigator));
    say("PushManager: " + ("PushManager" in window));
    say("Notification: " + ("Notification" in window
      ? Notification.permission : "無し"));

    // サービスワーカーが本当に入ったのかを見る。ここで止まる例が多い。
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(list => {
        say("いま入っているワーカー: " + list.length);
        list.forEach(r => say("  scope=" + r.scope + " active=" + !!r.active));
      }, error => say("ワーカーを数えられない: " + error, "ng"));
    }

    let sdk = null;
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async OneSignal => {
      say("台本が動き出した");
      try {
        await OneSignal.init({ appId: APP_ID });
        sdk = OneSignal;
        say("init 完了", "ok");
        say("optedIn: " + OneSignal.User.PushSubscription.optedIn);
        say("id: " + OneSignal.User.PushSubscription.id);
        OneSignal.User.PushSubscription.addEventListener("change", event => {
          say("変化: optedIn=" + event.current.optedIn + " id=" + event.current.id, "ok");
        });
      } catch (error) {
        say("init で転んだ: " + (error && (error.message || error)), "ng");
      }
    });
    setTimeout(() => { if (!sdk) say("8秒たっても init が終わらない", "ng"); }, 8000);
    setTimeout(() => {
      if (!window.OneSignal) say("台本そのものが届いていない", "ng");
    }, 8000);

    document.getElementById("ask").addEventListener("click", async () => {
      try {
        if (sdk) {
          await sdk.Notifications.requestPermission();
          say("聞いた。いま: " + Notification.permission, "ok");
        } else {
          const answer = await Notification.requestPermission();
          say("台本なしで聞いた: " + answer, "ok");
        }
      } catch (error) {
        say("聞けなかった: " + (error && (error.message || error)), "ng");
      }
    });

    document.getElementById("sub").addEventListener("click", async () => {
      if (!sdk) { say("まだ init が終わっていない", "ng"); return; }
      try {
        await sdk.User.PushSubscription.optIn();
        say("optIn した。optedIn=" + sdk.User.PushSubscription.optedIn
          + " id=" + sdk.User.PushSubscription.id, "ok");
      } catch (error) {
        say("optIn で転んだ: " + (error && (error.message || error)), "ng");
      }
    });
  </script>
</body>
</html>
